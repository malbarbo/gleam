[package]
name = "builtins-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
fast-float2 = { version = "0.2.4", default-features = false }
itoa = "1.0.15"
libm = "0.2.16"
memchr = { version = "2.8.0", default-features = false }
ryu = "1.0.23"
unicode-segmentation = "1.13.2"
wasi = { version = "0.11", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace]
